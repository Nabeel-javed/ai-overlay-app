<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
    <style>
        :root {
            --bg-color: #2d2d2d;
            --text-color: #e0e0e0;
            --label-color: #b0b0b0;
            --border-color: #555;
            --input-bg: #3a3a3a;
            --button-bg: #007aff;
            --button-hover-bg: #0056b3;
            --cancel-bg: #666;
            --cancel-hover-bg: #444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--label-color);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--button-bg);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.3);
        }

        .radio-group {
            margin-bottom: 15px;
        }

        .radio-option {
            margin-bottom: 8px;
        }

        .radio-option input[type="radio"] {
            margin-right: 8px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button.save {
            background-color: var(--button-bg);
            color: white;
        }

        button.save:hover {
            background-color: var(--button-hover-bg);
        }

        button.cancel {
            background-color: var(--cancel-bg);
            color: white;
        }

        button.cancel:hover {
            background-color: var(--cancel-hover-bg);
        }
    </style>
    <title>Settings</title>
</head>

<body>
    <h1>API Settings</h1>

    <div class="form-group">
        <label>Select AI Provider:</label>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="gemini" name="provider" value="gemini">
                <label for="gemini">Google Gemini</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="openai" name="provider" value="openai">
                <label for="openai">OpenAI</label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="gemini-key">Google Gemini API Key:</label>
        <input type="password" id="gemini-key" placeholder="Enter your Gemini API key">
    </div>

    <div class="form-group">
        <label for="openai-key">OpenAI API Key:</label>
        <input type="password" id="openai-key" placeholder="Enter your OpenAI API key">
    </div>

    <div class="buttons">
        <button class="cancel" id="cancel-button">Cancel</button>
        <button class="save" id="save-button">Save</button>
    </div>

    <script src="./settings.js"></script>
</body>

</html>
