<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
    <style>
        :root {
            --bg-color: #2d2d2d;
            --text-color: #e0e0e0;
            --label-color: #b0b0b0;
            --border-color: #555;
            --input-bg: #3a3a3a;
            --button-bg: #007aff;
            --button-hover-bg: #0056b3;
            --cancel-bg: #666;
            --cancel-hover-bg: #444;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #2d2d2d !important;
            color: #e0e0e0 !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
        }

        body {
            padding: 20px !important;
            font-size: 14px !important;
        }

        h1 {
            font-size: 20px !important;
            margin-top: 0 !important;
            margin-bottom: 20px !important;
            color: #e0e0e0 !important;
        }

        .form-group {
            margin-bottom: 20px !important;
        }

        label {
            display: block !important;
            margin-bottom: 5px !important;
            font-size: 14px !important;
            color: #b0b0b0 !important;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100% !important;
            padding: 8px !important;
            border-radius: 4px !important;
            border: 1px solid #555 !important;
            background-color: #3a3a3a !important;
            color: #e0e0e0 !important;
            font-size: 14px !important;
            box-sizing: border-box !important;
            -webkit-appearance: none !important;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none !important;
            border-color: #007aff !important;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.3) !important;
        }

        .radio-group {
            margin-bottom: 15px !important;
        }

        .radio-option {
            margin-bottom: 8px !important;
            color: #e0e0e0 !important;
        }

        .radio-option input[type="radio"] {
            margin-right: 8px !important;
        }

        .buttons {
            display: flex !important;
            justify-content: flex-end !important;
            gap: 10px !important;
            margin-top: 30px !important;
        }

        button {
            padding: 8px 16px !important;
            border: none !important;
            border-radius: 4px !important;
            cursor: pointer !important;
            font-size: 14px !important;
            font-weight: 500 !important;
        }

        button.save {
            background-color: #007aff !important;
            color: white !important;
        }

        button.save:hover {
            background-color: #0056b3 !important;
        }

        button.cancel {
            background-color: #666 !important;
            color: white !important;
        }

        button.cancel:hover {
            background-color: #444 !important;
        }

        select {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="6"><path d="M0 0l6 6 6-6z" fill="%23888"/></svg>') !important;
            background-repeat: no-repeat !important;
            background-position: right 10px center !important;
            padding-right: 30px !important;
        }

        /* Override default radio button styling */
        input[type="radio"] {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            width: 16px !important;
            height: 16px !important;
            border: 2px solid #555 !important;
            border-radius: 50% !important;
            outline: none !important;
            background-color: #3a3a3a !important;
            position: relative !important;
            vertical-align: middle !important;
        }

        input[type="radio"]:checked {
            border-color: #007aff !important;
        }

        input[type="radio"]:checked:after {
            content: "" !important;
            position: absolute !important;
            top: 3px !important;
            left: 3px !important;
            width: 6px !important;
            height: 6px !important;
            border-radius: 50% !important;
            background-color: #007aff !important;
        }
    </style>
    <title>Settings</title>
</head>

<body>
    <h1>API Settings</h1>

    <div class="form-group">
        <label>Select AI Provider:</label>
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="gemini" name="provider" value="gemini">
                <label for="gemini">Google Gemini</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="openai" name="provider" value="openai">
                <label for="openai">OpenAI</label>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="gemini-key">Google Gemini API Key:</label>
        <input type="password" id="gemini-key" placeholder="Enter your Gemini API key">
    </div>

    <div class="form-group">
        <label for="openai-key">OpenAI API Key:</label>
        <input type="password" id="openai-key" placeholder="Enter your OpenAI API key">
    </div>

    <div class="form-group" id="openai-model-group">
        <label for="openai-model">OpenAI Model:</label>
        <select id="openai-model">
            <option value="gpt-o3mini-high">gpt o3mini high (Text only)</option>
            <option value="o4mini-high">o4 mini high (Text only)</option>
            <option value="4.1">4.1 (Screenshot)</option>
        </select>
    </div>

    <div class="buttons">
        <button class="cancel" id="cancel-button">Cancel</button>
        <button class="save" id="save-button">Save</button>
    </div>

    <script src="./settings.js"></script>
</body>

</html>
