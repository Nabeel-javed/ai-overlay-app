<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectro</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="math-config.js"></script>
  <script defer src="node_modules/mathjax/es5/tex-mml-chtml.js"></script>
  <script defer src="node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <script defer src="node_modules/dompurify/dist/purify.min.js"></script>
  <script defer src="render-content.js"></script>
  <script defer src="renderer.js"></script>
</head>
<body>
  <main id="app-container">
    <header class="titlebar">
      <span class="brand">Spectro <small>SUBSCRIPTIONS</small></span>
      <div class="title-actions">
        <button id="new-chat" title="Start a new conversation">New chat</button>
        <button id="settings-button" title="Settings" aria-label="Settings">⚙</button>
        <button id="dismiss-button" title="Hide overlay" aria-label="Hide overlay">−</button>
      </div>
    </header>
    <div class="provider-row">
      <div class="segmented" aria-label="Provider">
        <button id="compare-mode" class="provider-btn" data-provider="compare">All three</button>
        <button class="provider-btn active" data-provider="openai">OpenAI</button>
        <button class="provider-btn" data-provider="claude">Claude</button>
        <button class="provider-btn" data-provider="grok">Grok</button>
      </div>
      <span id="astra-label" class="model-name">GPT-6 Astra</span>
      <span id="grok-label" class="model-name hidden">Grok 4.7</span>
      <span id="claude-label" class="model-name hidden">Claude Opus</span>
      <span id="connection-status" class="muted">Checking connection…</span>
    </div>
    <label for="input-textarea">Your question</label>
    <textarea id="input-textarea" rows="3" placeholder="Ask a question or capture a screenshot…"></textarea>
    <section id="screenshot-section" class="hidden">
      <div class="row"><label for="screenshot-img">Attached screenshot</label><button id="remove-screenshot-button" aria-label="Remove screenshot">×</button></div>
      <img id="screenshot-img" alt="Screenshot attached to the next question">
      <label for="instructions-textarea">Additional instructions</label>
      <textarea id="instructions-textarea" rows="2" placeholder="What should the assistant focus on?"></textarea>
    </section>
    <div id="controls" class="row">
      <button id="capture-button">Capture screen</button>
      <button id="attach-button">Attach image</button>
      <input id="image-file" class="hidden" type="file" accept="image/png,image/jpeg">
      <span id="submit-hint" class="muted">⌘ Enter to send</span>
      <button id="stop-button" class="hidden danger">Stop</button>
      <button id="submit-button" class="primary" disabled>Send</button>
    </div>
    <div id="status-message" role="status" aria-live="polite"></div>
    <section id="answer-section">
      <div class="response-header row">
        <span id="response-model" class="muted">Response</span>
        <div class="row">
          <button id="history-prev" title="Older response">←</button>
          <span id="history-indicator" class="muted">No history</span>
          <button id="history-next" title="Newer response">→</button>
          <button id="copy-response">Copy</button>
        </div>
      </div>
      <div id="history-actions" class="hidden row">
        <span class="muted">Viewing a saved response</span>
        <button id="resume-history">Continue this chat</button>
      </div>
      <div id="response-textarea" class="response-area" tabindex="0"></div>
      <div id="comparison-panels" class="hidden"></div>
      <p id="comparison-note" class="muted hidden">Each model remembers your questions and its own answers. Agreement does not prove correctness.</p>
    </section>
    <div id="notification" class="hidden" role="status"></div>
  </main>
</body>
</html>
