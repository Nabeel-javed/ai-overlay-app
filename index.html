<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.jsdelivr.net; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net;">
    <link rel="stylesheet" href="style.css">
    <title>Spectro</title>
    <!-- MathJax for rendering mathematical notation (loaded locally for faster performance) -->
    <script type="text/javascript" id="MathJax-script" async
        src="./node_modules/mathjax/es5/tex-mml-chtml.js">
        </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
                processHtmlClass: 'math'
            }
        };
        document.addEventListener("DOMContentLoaded", function () {
            // Make MathJax available to the renderer process
            window.typeset = function () {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            };
        });
    </script>
</head>

<body>
    <div id="app-container">
        <div class="section">
            <label for="input-textarea">Your Input (Edit as needed):</label>
            <textarea id="input-textarea" rows="6"></textarea>
        </div>

        <!-- New screenshot section -->
        <div id="screenshot-section" class="section hidden">
            <div id="screenshot-header">
                <label>Screenshot:</label>
                <button id="remove-screenshot-button" title="Remove Screenshot">×</button>
            </div>
            <div id="screenshot-container">
                <img id="screenshot-img" src="" alt="Screenshot">
            </div>
            <div id="custom-instructions">
                <label for="instructions-textarea">Custom Instructions (Optional):</label>
                <textarea id="instructions-textarea" rows="2"
                    placeholder="Enter any specific instructions for analyzing this screenshot..."></textarea>
            </div>
        </div>

        <div id="controls" class="section">
            <button id="submit-button">Submit to AI</button>
            <button id="dismiss-button">Dismiss</button>

            <div class="controls-right">
                <!-- Provider selector buttons -->
                <div class="provider-selector">
                    <span class="provider-label">Provider:</span>
                    <div class="provider-buttons">
                        <button class="provider-btn active" data-provider="openai">OpenAI</button>
                        <button class="provider-btn" data-provider="gemini">Gemini</button>
                        <button class="provider-btn" data-provider="deepseek">DeepSeek</button>
                        <button class="provider-btn" data-provider="claude">Claude</button>
                    </div>
                </div>

                <!-- Model selector buttons (only for OpenAI) -->
                <div class="model-selector" id="openai-model-selector">
                    <span class="model-label">Model:</span>
                    <div class="model-buttons">
                        <button class="model-btn" data-model="4.1">GPT-4.1</button>
                        <button class="model-btn active" data-model="o4-mini">o4-mini</button>
                    </div>
                </div>

                <!-- Reasoning toggle checkbox (for DeepSeek R1) -->
                <div class="reasoning-toggle" id="deepseek-reasoning-toggle" style="display: none;">
                    <input type="checkbox" id="enable-reasoning-deepseek" name="enable-reasoning-deepseek">
                    <label for="enable-reasoning-deepseek" id="deepseek-reasoning-label"
                        title="Enable R1 Reasoning Model">R1 Mode</label>
                </div>

                <button id="settings-button" class="settings-button" title="Settings">⚙</button>
            </div>
            <div id="shortcut-hints">
                <div>Ctrl+Shift+S to capture screenshot</div>
                <div>Ctrl+1/2/3/4 for OpenAI/Gemini/DeepSeek/Claude</div>
                <div>Ctrl+Shift+P to cycle providers</div>
                <div>Ctrl+Shift+R to toggle DeepSeek R1</div>
                <div>Ctrl+R to reset tool</div>
                <div>PageUp/PageDown or Alt+↑↓ to scroll response</div>
                <div>Home/End to jump to top/bottom</div>
            </div>
            <div id="loading-indicator" class="hidden">Working...</div>
        </div>

        <div class="section">
            <div class="response-header">
                <label for="response-textarea">AI Response:</label>
                <div class="response-controls">
                    <span id="history-indicator" class="history-indicator hidden" title="Use Ctrl+Up/Down to navigate history"></span>
                    <button id="copy-response" class="icon-button" title="Copy to clipboard (Ctrl+Shift+C)">Copy</button>
                </div>
            </div>
            <div id="response-textarea" class="text-area response-area"
                style="overflow-y: auto; white-space: pre-wrap;"></div>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>

</html>
