<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.jsdelivr.net; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net;">
    <link rel="stylesheet" href="style.css">
    <title>Spectro</title>
    <!-- MathJax for rendering mathematical notation -->
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
                processHtmlClass: 'math'
            }
        };
        document.addEventListener("DOMContentLoaded", function() {
            // Make MathJax available to the renderer process
            window.typeset = function() {
                if (typeof MathJax !== 'undefined') {
                    MathJax.typeset();
                }
            };
        });
    </script>
</head>

<body>
    <div id="app-container">
        <div class="section">
            <label for="input-textarea">Your Input (Edit as needed):</label>
            <textarea id="input-textarea" rows="6"></textarea>
        </div>

        <!-- New screenshot section -->
        <div id="screenshot-section" class="section hidden">
            <div id="screenshot-header">
                <label>Screenshot:</label>
                <button id="remove-screenshot-button" title="Remove Screenshot">×</button>
            </div>
            <div id="screenshot-container">
                <img id="screenshot-img" src="" alt="Screenshot">
            </div>
            <div id="custom-instructions">
                <label for="instructions-textarea">Custom Instructions (Optional):</label>
                <textarea id="instructions-textarea" rows="2"
                    placeholder="Enter any specific instructions for analyzing this screenshot..."></textarea>
            </div>
        </div>

        <div id="controls" class="section">
            <button id="submit-button">Submit to AI</button>
            <button id="dismiss-button">Dismiss</button>

            <div class="controls-right">
                <!-- Model selector buttons -->
                <div class="model-selector">
                    <span class="model-label">Model:</span>
                    <div class="model-buttons">
                        <button class="model-btn active" data-model="o4mini-high">GPT-4 Mini</button>
                        <button class="model-btn" data-model="4.1">GPT-4.1</button>
                    </div>
                </div>

                <!-- Reasoning toggle checkbox -->
                <div class="reasoning-toggle">
                    <input type="checkbox" id="enable-reasoning-main" name="enable-reasoning-main">
                    <label for="enable-reasoning-main" id="reasoning-label"
                        title="Enable Reasoning (GPT-4 Mini only)">Reasoning</label>
                </div>
            </div>

            <button id="settings-button" class="settings-button" title="Settings">⚙</button>
            <div id="shortcut-hints">
                <div>Ctrl+Shift+S to capture screenshot</div>
                <div>Ctrl+R to reset tool</div>
            </div>
            <div id="loading-indicator" class="hidden">Working...</div>
        </div>

        <div class="section">
            <label for="response-textarea">AI Response:</label>
            <div id="response-textarea" class="text-area response-area" style="overflow-y: auto; white-space: pre-wrap;"></div>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>

</html>
